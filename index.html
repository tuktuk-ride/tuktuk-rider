<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5b301">
  <title>TukTuk Rider</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛺</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🛺 TukTuk Rider</h1>
    <a href="admin.html">Admin ⚙</a>
  </header>

  <main>
    <div class="card">
      <p class="rate-info" id="rateInfo"></p>
      <p class="hint" id="rateSource"></p>
    </div>

    <div class="tabs">
      <button class="tab active" data-panel="mapPanel">📍 Map</button>
      <button class="tab" data-panel="meterPanel">🔢 Meter</button>
    </div>

    <!-- MAP MODE -->
    <section class="panel active" id="mapPanel">
      <div class="card">
        <div id="mapNotice" class="notice hidden"></div>
        <p class="hint" id="mapSource"></p>

        <label for="startSearch">Start location</label>
        <form class="search-row" data-which="start">
          <input type="search" id="startSearch" placeholder="Search start place…" enterkeyhint="search">
          <button class="btn search-btn" type="submit">🔍</button>
        </form>
        <ul class="search-results hidden" id="startResults"></ul>
        <div class="selected-place" id="startText"></div>
        <button class="btn small secondary" id="myLocationBtn" type="button">📡 Use my location as start</button>

        <label for="endSearch">End location</label>
        <form class="search-row" data-which="end">
          <input type="search" id="endSearch" placeholder="Search destination…" enterkeyhint="search">
          <button class="btn search-btn" type="submit">🔍</button>
        </form>
        <ul class="search-results hidden" id="endResults"></ul>
        <div class="selected-place" id="endText"></div>

        <p class="hint">Tip: you can also tap the map — 1st tap = start, 2nd tap = end. Drag pins to adjust.</p>
        <div id="map"></div>

        <div class="row">
          <button class="btn secondary" id="clearMapBtn" type="button">Clear</button>
          <button class="btn" id="calcMapBtn" type="button">Calculate Fare</button>
        </div>
        <div class="error" id="mapError"></div>
      </div>
    </section>

    <!-- METER MODE -->
    <section class="panel" id="meterPanel">
      <div class="card">
        <div class="row">
          <div>
            <label for="startMeter">Start meter (km)</label>
            <input type="number" id="startMeter" inputmode="decimal" step="0.1" min="0" placeholder="e.g. 12450.5">
          </div>
          <div>
            <label for="endMeter">End meter (km)</label>
            <input type="number" id="endMeter" inputmode="decimal" step="0.1" min="0" placeholder="e.g. 12458.2">
          </div>
        </div>
        <div class="row">
          <button class="btn secondary" id="clearMeterBtn" type="button">Clear</button>
          <button class="btn" id="calcMeterBtn" type="button">Calculate Fare</button>
        </div>
        <div class="error" id="meterError"></div>
      </div>
    </section>

    <!-- RESULT -->
    <section class="card result hidden" id="resultCard">
      <div class="distance" id="resultDistance"></div>
      <div class="total" id="resultTotal"></div>
      <div class="distance" id="resultDuration"></div>
      <table class="breakdown" id="resultBreakdown"></table>

      <div class="receipt-box">
        <label for="passengerName">Passenger name (optional, for receipt)</label>
        <input type="text" id="passengerName" placeholder="e.g. Nimal" autocomplete="off">
        <div class="row">
          <button class="btn secondary" id="downloadReceiptBtn" type="button">⬇ Download PDF</button>
          <button class="btn" id="shareReceiptBtn" type="button">📤 Share Receipt</button>
        </div>
      </div>
    </section>
  </main>

  <footer>Developed by <b>Team TGA</b></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
